<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0F172A" rx="16"/>
  <text x="400" y="40" text-anchor="middle" fill="#F1F5F9" font-family="sans-serif" font-size="24" font-weight="bold">Bristol Stool Chart</text>
  <!-- Type 1 -->
  <rect x="30" y="60" width="170" height="100" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="115" y="85" text-anchor="middle" fill="#14B8A6" font-size="14" font-weight="bold">Type 1</text>
  <circle cx="70" cy="120" r="8" fill="#94A3B8"/><circle cx="90" cy="115" r="9" fill="#94A3B8"/><circle cx="115" cy="118" r="8" fill="#94A3B8"/><circle cx="140" cy="125" r="7" fill="#94A3B8"/><circle cx="160" cy="120" r="8" fill="#94A3B8"/>
  <text x="115" y="150" text-anchor="middle" fill="#94A3B8" font-size="10">Separate hard lumps</text>
  <!-- Type 2 -->
  <rect x="220" y="60" width="170" height="100" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="305" y="85" text-anchor="middle" fill="#14B8A6" font-size="14" font-weight="bold">Type 2</text>
  <ellipse cx="280" cy="120" rx="18" ry="10" fill="#94A3B8"/><ellipse cx="310" cy="115" rx="20" ry="11" fill="#94A3B8"/><ellipse cx="345" cy="118" rx="17" ry="9" fill="#94A3B8"/>
  <text x="305" y="150" text-anchor="middle" fill="#94A3B8" font-size="10">Lumpy sausage</text>
  <!-- Type 3 -->
  <rect x="30" y="180" width="170" height="100" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="115" y="205" text-anchor="middle" fill="#14B8A6" font-size="14" font-weight="bold">Type 3</text>
  <ellipse cx="80" cy="240" rx="22" ry="12" fill="#94A3B8"/><ellipse cx="150" cy="235" rx="24" ry="13" fill="#94A3B8"/>
  <text x="115" y="270" text-anchor="middle" fill="#94A3B8" font-size="10">Cracked sausage</text>
  <!-- Type 4 -->
  <rect x="220" y="180" width="170" height="100" rx="12" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
  <text x="305" y="205" text-anchor="middle" fill="#14B8A6" font-size="14" font-weight="bold">Type 4 (Ideal)</text>
  <ellipse cx="280" cy="245" rx="25" ry="14" fill="#F1F5F9"/><ellipse cx="330" cy="240" rx="27" ry="15" fill="#F1F5F9"/>
  <text x="305" y="270" text-anchor="middle" fill="#94A3B8" font-size="10">Smooth snake</text>
  <!-- Type 5 -->
  <rect x="410" y="60" width="170" height="100" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="495" y="85" text-anchor="middle" fill="#14B8A6" font-size="14" font-weight="bold">Type 5</text>
  <circle cx="460" cy="120" r="14" fill="#94A3B8"/><circle cx="490" cy="110" r="16" fill="#94A3B8"/><circle cx="520" cy="125" r="13" fill="#94A3B8"/>
  <text x="495" y="150" text-anchor="middle" fill="#94A3B8" font-size="10">Soft blobs</text>
  <!-- Type 6 -->
  <rect x="410" y="180" width="170" height="100" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="495" y="205" text-anchor="middle" fill="#14B8A6" font-size="14" font-weight="bold">Type 6</text>
  <circle cx="430" cy="240" r="18" fill="#94A3B8"/><circle cx="470" cy="225" r="20" fill="#94A3B8"/><circle cx="510" cy="235" r="19" fill="#94A3B8"/><circle cx="540" cy="250" r="17" fill="#94A3B8"/>
  <text x="495" y="270" text-anchor="middle" fill="#94A3B8" font-size="10">Mushy fluffy pieces</text>
  <!-- Type 7 -->
  <rect x="250" y="300" width="300" height="100" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" fill="#EF4444" font-size="14" font-weight="bold">Type 7 (Severe Diarrhoea)</text>
  <ellipse cx="330" cy="365" rx="40" ry="22" fill="#EF4444" opacity="0.8"/><ellipse cx="400" cy="355" rx="45" ry="25" fill="#EF4444" opacity="0.6"/><ellipse cx="470" cy="370" rx="38" ry="20" fill="#EF4444" opacity="0.7"/>
  <text x="400" y="390" text-anchor="middle" fill="#94A3B8" font-size="10">Watery, no solid pieces</text>
  <!-- Footer -->
  <text x="400" y="430" text-anchor="middle" fill="#64748B" font-size="12">Source: Bristol Stool Scale — Public Domain</text>
</svg>
